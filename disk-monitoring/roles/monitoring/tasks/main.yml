---
# VERIFY: confirm the agent is running, and provide an on-demand df snapshot
# that publishes a custom metric (fallback / immediate check path).

- name: Query CloudWatch Agent status
  ansible.builtin.command: "{{ cwagent_ctl }} -a status"
  become: true
  register: _cw_status
  changed_when: false
  failed_when: false

- name: Show agent status
  ansible.builtin.debug:
    var: _cw_status.stdout

# ---- on-demand df collection (fallback) ----
- name: Build df exclude flags
  ansible.builtin.set_fact:
    _df_excludes: "{{ ignore_fs_types | map('regex_replace', '^(.*)$', '-x \\1') | join(' ') }}"

- name: Collect per-mount used_percent (mount=percent pairs)
  ansible.builtin.shell: >-
    df -P {{ _df_excludes }} | awk 'NR>1 {gsub("%","",$5); print $6"="$5}'
  register: df_pairs
  changed_when: false

- name: Publish each mount's used_percent to CloudWatch
  ansible.builtin.command: >-
    aws cloudwatch put-metric-data
    --namespace "{{ cloudwatch_namespace }}"
    --metric-name disk_used_percent
    --unit Percent
    --value {{ item.split('=')[1] }}
    --dimensions InstanceId={{ ansible_aws_ssm_instance_id }},MountPath={{ item.split('=')[0] }}
    --region {{ ansible_aws_ssm_region }}
  delegate_to: localhost
  loop: "{{ df_pairs.stdout_lines }}"
  changed_when: false

- name: Warn when a mount exceeds the critical threshold
  ansible.builtin.debug:
    msg: "ALERT: {{ ansible_aws_ssm_instance_id }} {{ item.split('=')[0] }} at {{ item.split('=')[1] }}% (>= {{ disk_threshold }}%)"
  loop: "{{ df_pairs.stdout_lines }}"
  when: (item.split('=')[1] | int) >= (disk_threshold | default(80) | int)

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="up" markerWidth="12" markerHeight="12" refX="4" refY="9" orient="auto" markerUnits="strokeWidth">
      <path d="M4,0 L8,9 L0,9 Z" fill="#2e7d32"/>
    </marker>
    <style>
      .t{font-size:24px;font-weight:800;fill:#16191f}
      .s{font-size:14px;fill:#5a6472}
      .hub{font-size:17px;font-weight:800;fill:#0d3b66}
      .hubi{font-size:13px;fill:#28527a}
      .acct{font-size:14px;font-weight:700;fill:#1b5e20}
      .vm{font-size:12px;font-weight:700;fill:#16191f}
      .cap{font-size:12px;fill:#2e7d32;font-style:italic}
      .flow{stroke:#2e7d32;stroke-width:2.5;fill:none;marker-end:url(#up)}
      .num{font-size:15px;font-weight:800;fill:#fff}
    </style>
  </defs>

  <text x="40" y="42" class="t">Disk Monitoring — The Simple Picture</text>
  <text x="40" y="66" class="s">Every VM reports its disk usage upward into one central account you watch.</text>

  <!-- HUB -->
  <rect x="230" y="95" width="500" height="150" rx="14" fill="#eaf2fb" stroke="#0d3b66" stroke-width="2.5"/>
  <text x="480" y="126" class="hub" text-anchor="middle">🎯 MONITORING ACCOUNT — "the HUB"</text>
  <line x1="260" y1="140" x2="700" y2="140" stroke="#b8cfe6"/>
  <text x="480" y="166" class="hubi" text-anchor="middle">📊 One dashboard showing ALL disks, across every account</text>
  <text x="480" y="190" class="hubi" text-anchor="middle">🔔 Alarm rule: "any disk over 80% → alert on-call (email / Slack)"</text>
  <text x="480" y="214" class="hubi" text-anchor="middle">🛠️ Ansible control node — sets up each VM once</text>

  <!-- flow arrows from spokes up to hub -->
  <path class="flow" d="M160 470 C 160 360, 300 300, 360 250"/>
  <path class="flow" d="M480 470 L 480 250"/>
  <path class="flow" d="M800 470 C 800 360, 660 300, 600 250"/>
  <text x="500" y="360" class="cap">disk % flows UP every minute</text>

  <!-- SPOKES -->
  <!-- Account A -->
  <g>
    <rect x="60" y="475" width="200" height="180" rx="12" fill="#f2f8f2" stroke="#2e7d32" stroke-width="2"/>
    <text x="160" y="503" class="acct" text-anchor="middle">Account A</text>
    <rect x="82" y="520" width="70" height="60" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="117" y="548" class="vm" text-anchor="middle">VM</text>
    <text x="117" y="566" class="vm" text-anchor="middle">💾</text>
    <rect x="168" y="520" width="70" height="60" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="203" y="548" class="vm" text-anchor="middle">VM</text>
    <text x="203" y="566" class="vm" text-anchor="middle">💾</text>
    <text x="160" y="608" class="cap" text-anchor="middle">tiny agent on</text>
    <text x="160" y="626" class="cap" text-anchor="middle">each VM reports %</text>
  </g>
  <!-- Account B -->
  <g>
    <rect x="380" y="475" width="200" height="180" rx="12" fill="#f2f8f2" stroke="#2e7d32" stroke-width="2"/>
    <text x="480" y="503" class="acct" text-anchor="middle">Account B</text>
    <rect x="402" y="520" width="70" height="60" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="437" y="548" class="vm" text-anchor="middle">VM</text>
    <text x="437" y="566" class="vm" text-anchor="middle">💾</text>
    <rect x="488" y="520" width="70" height="60" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="523" y="548" class="vm" text-anchor="middle">VM</text>
    <text x="523" y="566" class="vm" text-anchor="middle">💾</text>
    <text x="480" y="617" class="cap" text-anchor="middle">same setup, automatically</text>
  </g>
  <!-- Account C -->
  <g>
    <rect x="700" y="475" width="200" height="180" rx="12" fill="#f2f8f2" stroke="#2e7d32" stroke-width="2"/>
    <text x="800" y="503" class="acct" text-anchor="middle">Account C … (more)</text>
    <rect x="722" y="520" width="70" height="60" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="757" y="548" class="vm" text-anchor="middle">VM</text>
    <text x="757" y="566" class="vm" text-anchor="middle">💾</text>
    <rect x="808" y="520" width="70" height="60" rx="8" fill="#fff" stroke="#2e7d32"/>
    <text x="843" y="548" class="vm" text-anchor="middle">VM</text>
    <text x="843" y="566" class="vm" text-anchor="middle">💾</text>
    <text x="800" y="617" class="cap" text-anchor="middle">tag a VM → auto-enrolled</text>
  </g>

  <text x="40" y="695" class="s">The 4 parts:  ① agent on each VM   ② CloudWatch collects the numbers   ③ one-way mirror shows all accounts in the hub   ④ alarm → alert</text>
</svg>
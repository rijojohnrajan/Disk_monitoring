<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <style>
      .title{font-size:22px;font-weight:700;fill:#16191f}
      .sub{font-size:12px;fill:#556}
      .acct{font-size:13px;font-weight:700;fill:#0d3b66}
      .lbl{font-size:12px;fill:#16191f}
      .small{font-size:11px;fill:#445}
      .flow{stroke:#555;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
      .flowd{stroke:#e07b00;stroke-width:1.6;fill:none;stroke-dasharray:5 4;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="30" y="34" class="title">AWS Multi-Account Disk Utilization Monitoring — Ansible + CloudWatch</text>
  <text x="30" y="54" class="sub">Keyless access via SSM · continuous CloudWatch Agent metrics · cross-account aggregation via OAM · SNS alerting · StackSet scaling</text>

  <rect x="30" y="80" width="470" height="300" rx="10" fill="#eaf2fb" stroke="#0d3b66" stroke-width="1.5"/>
  <text x="48" y="104" class="acct">Monitoring / Tooling Account (111122223333)</text>

  <rect x="52" y="120" width="180" height="70" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="62" y="142" class="lbl" font-weight="700">Ansible Control Node</text>
  <text x="62" y="160" class="small">aws_ec2 dynamic inventory</text>
  <text x="62" y="176" class="small">aws_ssm connection (no SSH)</text>

  <rect x="250" y="120" width="230" height="70" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="260" y="142" class="lbl" font-weight="700">CloudWatch (central)</text>
  <text x="260" y="160" class="small">OAM Sink · cross-account dashboards</text>
  <text x="260" y="176" class="small">Metrics Insights: fullest volumes top-N</text>

  <rect x="52" y="210" width="180" height="66" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="62" y="232" class="lbl" font-weight="700">CloudWatch Alarms</text>
  <text x="62" y="250" class="small">disk_used_percent &gt;= 80%</text>
  <text x="62" y="266" class="small">TreatMissingData: breaching</text>

  <rect x="250" y="210" width="230" height="66" rx="8" fill="#fff4e5" stroke="#e07b00"/>
  <text x="260" y="232" class="lbl" font-weight="700">SNS Topic → notifications</text>
  <text x="260" y="250" class="small">email · Slack · PagerDuty · ticketing</text>

  <rect x="52" y="296" width="428" height="66" rx="8" fill="#ffffff" stroke="#3b6ea5"/>
  <text x="62" y="318" class="lbl" font-weight="700">Governance (Organizations)</text>
  <text x="62" y="336" class="small">CloudFormation StackSets → IAM roles, instance profiles, OAM links</text>
  <text x="62" y="352" class="small">SSM State Manager keeps CW Agent installed (self-healing)</text>

  <g>
    <rect x="640" y="80" width="510" height="150" rx="10" fill="#f2f8f2" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="658" y="104" class="acct" fill="#1b5e20">Member Account A — VPC (private subnets)</text>
    <rect x="660" y="118" width="140" height="96" rx="8" fill="#ffffff" stroke="#2e7d32"/>
    <text x="670" y="140" class="lbl" font-weight="700">EC2 VM</text>
    <text x="670" y="158" class="small">SSM Agent</text>
    <text x="670" y="174" class="small">CloudWatch Agent</text>
    <text x="670" y="190" class="small">Instance profile</text>
    <text x="670" y="206" class="small">tag Monitoring=Enabled</text>
    <rect x="812" y="118" width="140" height="96" rx="8" fill="#ffffff" stroke="#2e7d32"/>
    <text x="822" y="140" class="lbl" font-weight="700">EC2 VM</text>
    <text x="822" y="158" class="small">SSM Agent</text>
    <text x="822" y="174" class="small">CloudWatch Agent</text>
    <text x="822" y="190" class="small">disk_used_percent 60s</text>
    <rect x="964" y="118" width="166" height="96" rx="8" fill="#ffffff" stroke="#2e7d32"/>
    <text x="974" y="140" class="lbl" font-weight="700">Account services</text>
    <text x="974" y="158" class="small">xAcct IAM role (AssumeRole)</text>
    <text x="974" y="174" class="small">CloudWatch (local metrics)</text>
    <text x="974" y="190" class="small">OAM Link → Sink</text>
    <text x="974" y="206" class="small">SSM endpoints</text>
  </g>

  <g>
    <rect x="640" y="250" width="510" height="120" rx="10" fill="#f2f8f2" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="658" y="274" class="acct" fill="#1b5e20">Member Account B / C … (auto-enrolled on account creation)</text>
    <rect x="660" y="288" width="140" height="66" rx="8" fill="#ffffff" stroke="#2e7d32"/>
    <text x="670" y="310" class="lbl" font-weight="700">EC2 VMs</text>
    <text x="670" y="328" class="small">SSM + CW Agent</text>
    <text x="670" y="344" class="small">OAM Link → Sink</text>
    <rect x="812" y="288" width="318" height="66" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-dasharray="4 3"/>
    <text x="822" y="310" class="small">Same StackSet-deployed roles, profiles, and OAM link.</text>
    <text x="822" y="328" class="small">New tagged VM → discovered by aws_ec2 inventory → enrolled</text>
    <text x="822" y="344" class="small">by cloudwatch_agent role → metrics flow to central sink.</text>
  </g>

  <path class="flow" d="M232 150 C 460 130, 520 150, 660 158"/>
  <text x="470" y="126" class="small">AssumeRole + aws_ssm (keyless, portless)</text>
  <path class="flow" d="M952 160 C 990 160, 995 150, 1010 150"/>
  <path class="flowd" d="M964 196 C 720 300, 560 220, 480 170"/>
  <text x="600" y="250" class="small" fill="#e07b00">OAM: share metrics → central Sink</text>
  <path class="flowd" d="M800 320 C 600 320, 540 250, 480 200"/>
  <path class="flow" d="M232 243 L 250 243"/>
  <path class="flow" d="M300 190 L 160 210"/>

  <text x="30" y="410" class="sub" font-weight="700">Legend:</text>
  <line x1="90" y1="405" x2="130" y2="405" class="flow"/>
  <text x="136" y="409" class="small">control / query / alert path</text>
  <line x1="300" y1="405" x2="340" y2="405" class="flowd"/>
  <text x="346" y="409" class="small">cross-account metric aggregation (OAM)</text>

  <rect x="30" y="430" width="1120" height="120" rx="10" fill="#fafafa" stroke="#ccc"/>
  <text x="46" y="454" class="lbl" font-weight="700">Data collection (two complementary paths)</text>
  <text x="46" y="476" class="small">1. Continuous (primary): CloudWatch Agent → disk_used_percent, inodes_free, used, total every 60s, dimensioned by InstanceId + MountPath.</text>
  <text x="46" y="496" class="small">2. On-demand / fallback: Ansible monitoring role runs `df` over SSM → put-metric-data to the CustomDisk namespace (also usable via cron script).</text>
  <text x="46" y="520" class="small">Aggregation: OAM makes all member-account metrics queryable in the monitoring account — one dashboard, one set of alarms, no ETL / data movement.</text>
  <text x="46" y="540" class="small">Scale: aws_ec2 tag discovery + StackSet org auto-deployment + SSM State Manager drift correction = zero manual per-VM work.</text>

  <text x="30" y="588" class="lbl" font-weight="700">Enrollment lifecycle</text>
  <rect x="30" y="600" width="1120" height="60" rx="10" fill="#eef4ff" stroke="#3b6ea5"/>
  <text x="46" y="624" class="small">Launch tagged VM (Monitoring=Enabled)  →  aws_ec2 inventory discovers it  →  cloudwatch_config role installs/configures agent over SSM</text>
  <text x="46" y="644" class="small">→  metrics flow to local CloudWatch  →  OAM Link shares to central Sink  →  dashboards + alarm (80%) → SNS.  Adding an account: StackSet auto-deploys everything.</text>
</svg>